# dcm-theme 主题配置

# =================== 站点配置 ===================
# Logo 图片路径（相对于 theme/source/ 目录）
logo: "/img/logo.png"
icp: "豫ICP备15029427号"

# =================== 菜单配置 ===================
menu:
  home:
    title: "首页"
    url: "/"
  categories:
    - { title: "技术", slug: "技术" }
    - { title: "生活", slug: "生活" }
    - { title: "随笔", slug: "随笔" }
  archive:
    title: "归档"
    url: "/archives/"
  about:
    title: "关于"
    url: "/about/"

# =================== 作者信息 ===================
author:
  name: "作者名称"
  avatar: "/img/avatar.png"
  description: "[南阳] 生命依然顽强，生活依旧美好"
  contacts:
    - { icon: "email", url: "mailto:839820152@qq.com", label: "Email：839820152@qq.com" }

# =================== 侧边栏组件顺序 ===================
sidebar_widgets:
  - search
  - author
  - category
  - tag
  - recent_posts
  - links

# =================== 搜索配置 ===================
search:
  enable: true

# =================== 友情链接 ===================
links:
  - { name: "Hexo", url: "https://hexo.io", avatar: "" }
  - { name: "GitHub", url: "https://github.com", avatar: "" }

# =================== 文章设置 ===================
# 首页每页显示文章数
posts_per_page: 10

# 文章摘要长度（字符数）
excerpt_length: 200

# =================== 侧边栏文章数量 ===================
# 最近文章显示数量
recent_posts_count: 5

# =================== 主题信息 ===================
theme_name: dcm-theme
theme_version: "1.0.0"

baidu_analytics: 0bb4d40ef2c0e2aa9ab05e208b497043
